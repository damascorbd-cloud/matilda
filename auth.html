<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matilda - Portal Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black font-sans min-h-screen flex items-center justify-center p-4">
    <div id="app" class="w-full max-w-md">
        <div class="text-center mb-12">
            <h1 class="font-serif text-4xl font-bold tracking-[0.15em] uppercase mb-2">Matilda</h1>
            <p class="text-xs uppercase tracking-[0.2em] text-gray-500">{{ isLogin ? 'Client Portal' : 'Create Account' }}</p>
        </div>

        <form @submit.prevent="submitForm" class="space-y-6">
            <div v-if="!isLogin">
                <label class="block text-[0.65rem] uppercase tracking-widest text-gray-900 mb-2 font-semibold">Full Name</label>
                <input v-model="form.full_name" type="text" name="full_name" required class="w-full border-b border-black py-2 focus:outline-none focus:border-gray-400 transition-colors bg-transparent text-sm">
            </div>

            <div>
                <label class="block text-[0.65rem] uppercase tracking-widest text-gray-900 mb-2 font-semibold">Email Address</label>
                <input v-model="form.email" type="email" name="email" required class="w-full border-b border-black py-2 focus:outline-none focus:border-gray-400 transition-colors bg-transparent text-sm">
            </div>

            <div v-if="!isLogin">
                <label class="block text-[0.65rem] uppercase tracking-widest text-gray-900 mb-2 font-semibold">Phone Number</label>
                <input v-model="form.phone_number" type="tel" name="phone_number" required class="w-full border-b border-black py-2 focus:outline-none focus:border-gray-400 transition-colors bg-transparent text-sm">
                <p class="text-[0.6rem] text-gray-500 mt-1 uppercase tracking-wider">Required for UAE Courier Delivery</p>
            </div>

            <div>
                <label class="block text-[0.65rem] uppercase tracking-widest text-gray-900 mb-2 font-semibold">Password</label>
                <input v-model="form.password" type="password" name="password" required class="w-full border-b border-black py-2 focus:outline-none focus:border-gray-400 transition-colors bg-transparent text-sm">
            </div>

            <button type="submit" class="w-full bg-black text-white py-4 text-xs uppercase tracking-[0.2em] font-bold hover:bg-gray-800 transition-colors mt-8">
                {{ isLogin ? 'Sign In' : 'Register' }}
            </button>
        </form>

        <div class="mt-8 text-center">
            <button @click="isLogin = !isLogin" class="text-xs uppercase tracking-widest text-gray-500 hover:text-black transition-colors border-b border-transparent hover:border-black pb-1">
                {{ isLogin ? 'Create a new account' : 'Already have an account? Sign In' }}
            </button>
        </div>
    </div>

    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    isLogin: true,
                    form: {
                        full_name: '',
                        email: '',
                        password: '',
                        phone_number: ''
                    }
                }
            },
            methods: {
                submitForm() {
                    console.log("Form Data:", JSON.stringify(this.form, null, 2));
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
